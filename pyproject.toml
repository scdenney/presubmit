[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presubmit"
version = "0.1.0"
description = "Claude-powered adversarial peer review for academic PDFs: red-team critique, claim verification, and structured review reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-4.0"}
authors = [{name = "Steven Denney"}]
keywords = ["peer-review", "llm", "claude", "anthropic", "academic", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
dependencies = [
    "anthropic>=0.97.0",
    "marker-pdf",
    "pypdf",
    "reportlab",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
presubmit = "presubmit.cli:main"

[project.urls]
Homepage = "https://github.com/scdenney/presubmit"
License = "https://creativecommons.org/licenses/by/4.0/"
Upstream = "https://github.com/isitcredible/reviewer2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
presubmit = [
    "prompts/*.txt",
    "prompts/resources/*.txt",
    "prompts/resources/*.pdf",
    "data/*.csv",
]
